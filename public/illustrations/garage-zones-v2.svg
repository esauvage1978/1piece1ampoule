<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="floor" x1="200" y1="180" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .zoneText{font-family:ui-sans-serif,system-ui;font-size:24px;font-weight:900;fill:#FDE68A}
      .label{font-family:ui-sans-serif,system-ui;font-size:22px;font-weight:800;fill:#E5E7EB}
    </style>
  </defs>

  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="290" cy="190" r="170" fill="#FBBF24" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="220" r="210" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Main room -->
  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Zones: left storage, right workbench, center parking, near door entry -->
  <!-- Storage (left) -->
  <rect x="220" y="210" width="420" height="480" rx="26" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="3"/>
  <text x="250" y="310" class="zoneText">Zone 1: stockage</text>
  <rect x="250" y="350" width="360" height="40" rx="18" fill="#111B33" stroke="#2B3B66"/>
  <rect x="250" y="410" width="360" height="40" rx="18" fill="#111B33" stroke="#2B3B66"/>
  <rect x="250" y="470" width="360" height="40" rx="18" fill="#111B33" stroke="#2B3B66"/>

  <!-- Workbench (right) -->
  <rect x="780" y="210" width="400" height="310" rx="26" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.70" stroke-width="3"/>
  <text x="810" y="300" class="zoneText">Zone 2: etabli</text>
  <rect x="820" y="330" width="320" height="90" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <rect x="860" y="420" width="240" height="30" rx="12" fill="#141F3E" stroke="#2B3B66"/>

  <!-- Parking / aisle (center) -->
  <rect x="610" y="540" width="550" height="250" rx="26" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="3"/>
  <text x="640" y="620" class="zoneText" fill="#BAE6FD">Zone 3: stationnement</text>
  <rect x="670" y="670" width="150" height="70" rx="18" fill="#0B1220" stroke="#2B3B66"/>

  <!-- Entry (near door) -->
  <rect x="220" y="720" width="420" height="120" rx="26" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.70" stroke-width="3"/>
  <text x="250" y="770" class="zoneText" fill="#A7F3D0">Zone 4: entree</text>
  <rect x="580" y="730" width="70" height="90" rx="16" fill="#0B1220" stroke="#2B3B66"/>

  <!-- Counter/door labels -->
  <text x="230" y="170" class="label">Garage: decoupe en zones pour guider l'eclairage</text>

  <!-- Legend strip -->
  <rect x="220" y="820" width="960" height="50" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="250" y="852" class="label" fill="#E5E7EB">Stockage + etabli (IRC) + plafond pour circulation + entree avec capteur</text>
</svg>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="gridGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="floor" x1="200" y1="180" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <style>
      .label { font-family: ui-sans-serif, system-ui; font-size: 24px; font-weight: 800; fill: #E5E7EB; }
      .zoneText { font-family: ui-sans-serif, system-ui; font-size: 22px; font-weight: 800; fill: #FDE68A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <g opacity="0.22">
    <path d="M120 160H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 260H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 360H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 460H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 560H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 660H1280" stroke="#2B3B66" stroke-width="2"/>
    <path d="M120 760H1280" stroke="#2B3B66" stroke-width="2"/>
  </g>

  <!-- Floor / room -->
  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Perimeter cabinets & counters (top-down) -->
  <!-- Top wall cabinets -->
  <rect x="250" y="200" width="520" height="70" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <!-- Right wall cabinets -->
  <rect x="880" y="230" width="270" height="200" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <!-- Bottom wall cabinets -->
  <rect x="250" y="640" width="520" height="70" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <!-- Left wall cabinets -->
  <rect x="200" y="260" width="70" height="380" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Main counters around perimeter -->
  <rect x="270" y="240" width="480" height="24" rx="12" fill="#141F3E"/>
  <rect x="270" y="620" width="480" height="24" rx="12" fill="#141F3E"/>
  <rect x="230" y="280" width="24" height="340" rx="12" fill="#141F3E"/>
  <rect x="900" y="260" width="24" height="160" rx="12" fill="#141F3E"/>

  <!-- Fridge (left) -->
  <rect x="220" y="300" width="50" height="140" rx="14" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <rect x="232" y="320" width="26" height="22" rx="8" fill="#34D399" opacity="0.35"/>

  <!-- Sink (right/bottom counter) -->
  <rect x="430" y="610" width="90" height="30" rx="12" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <path d="M455 625c10-10 22-10 32 0" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Cooktop (top counter) -->
  <rect x="520" y="225" width="95" height="30" rx="12" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <circle cx="540" cy="240" r="10" fill="#2B3B66"/>
  <circle cx="565" cy="240" r="10" fill="#2B3B66"/>
  <circle cx="590" cy="240" r="10" fill="#2B3B66"/>

  <!-- Island (center) -->
  <rect x="610" y="430" width="380" height="190" rx="28" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="630" y="460" width="340" height="32" rx="16" fill="#141F3E"/>
  <rect x="760" y="500" width="100" height="120" rx="20" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Dining / ambiance zone (right bottom) -->
  <rect x="900" y="560" width="230" height="180" rx="28" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="940" y="600" width="150" height="28" rx="14" fill="#141F3E"/>

  <!-- ========= Zones overlays ========= -->
  <!-- Zone 1: work lighting along counters -->
  <path d="M260 248h500v38H260z" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M260 632h500v38H260z" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M228 280h38v340h-38z" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M880 260h38v160h-38z" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M610 430h380v190H610z" fill="#FBBF24" fill-opacity="0.09"/>

  <!-- Zone 2: central / circulation -->
  <rect x="310" y="310" width="650" height="380" rx="30" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="4"/>
  <circle cx="640" cy="500" r="20" fill="#BAE6FD" fill-opacity="0.35"/>
  <circle cx="820" cy="470" r="22" fill="#BAE6FD" fill-opacity="0.35"/>
  <circle cx="900" cy="600" r="20" fill="#BAE6FD" fill-opacity="0.35"/>

  <!-- Zone 3: ambiance (dining + warm areas) -->
  <path d="M900 560h230v180H900z" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="3"/>
  <circle cx="1010" cy="650" r="70" fill="#A78BFA" fill-opacity="0.08" filter="url(#gridGlow)"/>

  <!-- Zone 4: electromenager specific -->
  <rect x="220" y="290" width="70" height="170" rx="22" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.70" stroke-width="3"/>
  <rect x="470" y="610" width="140" height="40" rx="20" fill="#34D399" fill-opacity="0.08"/>
  <rect x="520" y="205" width="130" height="65" rx="20" fill="#34D399" fill-opacity="0.08"/>

  <!-- Labels -->
  <text x="250" y="285" class="zoneText">Zone 1: plan de travail</text>
  <text x="680" y="370" class="zoneText" fill="#BAE6FD">Zone 2: eclairage central</text>
  <text x="910" y="600" class="zoneText" fill="#E9D5FF">Zone 3: ambiance</text>
  <text x="235" y="495" class="zoneText" fill="#A7F3D0">Zone 4: electromenager</text>

  <text x="210" y="110" class="label">Cuisine vue de dessus decoupee en zones</text>

  <!-- Legend strip -->
  <rect x="220" y="810" width="960" height="50" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="250" y="842" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="800" fill="#E5E7EB">
    Guide: zone 1 ciblee " zone 2 homogene " zone 3 douce " zone 4 specifique
  </text>
</svg>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="floor" x1="200" y1="170" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .zoneText{font-family:ui-sans-serif,system-ui;font-size:24px;font-weight:900;fill:#FDE68A}
      .label{font-family:ui-sans-serif,system-ui;font-size:22px;font-weight:800;fill:#E5E7EB}
    </style>
  </defs>

  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="300" cy="190" r="170" fill="#FBBF24" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="220" r="210" fill="#38BDF8" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="820" cy="720" r="240" fill="#A78BFA" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Table zone furniture (approximate) -->
  <rect x="420" y="380" width="560" height="250" rx="34" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="460" y="420" width="480" height="170" rx="24" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>
  <!-- Chairs -->
  <rect x="470" y="330" width="90" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="640" y="330" width="120" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="820" y="330" width="90" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="470" y="630" width="90" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="640" y="630" width="120" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="820" y="630" width="90" height="60" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Buffet zone -->
  <rect x="910" y="240" width="300" height="160" rx="28" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="940" y="265" width="240" height="110" rx="22" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>

  <!-- Circulation / entrance -->
  <rect x="220" y="420" width="160" height="320" rx="28" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>

  <!-- Zones overlays -->
  <!-- Zone 1: Table -->
  <rect x="390" y="360" width="620" height="290" rx="36" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="3"/>
  <text x="430" y="460" class="zoneText">Zone 1: table / repas</text>

  <!-- Zone 2: Buffet -->
  <rect x="880" y="215" width="360" height="210" rx="40" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="4"/>
  <text x="910" y="310" class="zoneText" fill="#BAE6FD">Zone 2: buffet / rangement</text>

  <!-- Zone 3: Ambiance / indirect -->
  <path d="M250 560c90-120 200-140 340-90c160 55 280 35 420-45v310H250V560Z" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="3"/>
  <text x="360" y="720" class="zoneText" fill="#E9D5FF">Zone 3: ambiance (indirect)</text>

  <!-- Zone 4: Circulation -->
  <rect x="210" y="410" width="220" height="360" rx="34" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.60" stroke-width="3"/>
  <text x="250" y="575" class="zoneText" fill="#A7F3D0">Zone 4: circulation</text>

  <!-- Title strip -->
  <rect x="90" y="70" width="1220" height="56" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="120" y="108" class="label">Salle a manger decoupee en zones</text>
</svg>


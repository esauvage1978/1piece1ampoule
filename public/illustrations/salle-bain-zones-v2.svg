<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="floor" x1="200" y1="160" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .zoneText{font-family:ui-sans-serif,system-ui;font-size:24px;font-weight:900;fill:#FDE68A}
      .label{font-family:ui-sans-serif,system-ui;font-size:22px;font-weight:800;fill:#E5E7EB}
    </style>
  </defs>

  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="260" cy="190" r="170" fill="#FBBF24" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="220" r="210" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="820" cy="720" r="240" fill="#A78BFA" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Vanity / mirror -->
  <rect x="260" y="230" width="360" height="140" rx="26" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="300" y="260" width="280" height="80" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <rect x="300" y="360" width="280" height="35" rx="14" fill="#0F1730" stroke="#2B3B66" stroke-width="3"/>

  <!-- Shower / bath zone -->
  <rect x="780" y="230" width="320" height="260" rx="30" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="820" y="260" width="240" height="200" rx="22" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <path d="M845 355c55-50 120-50 150 0" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <!-- Toilet -->
  <rect x="620" y="580" width="200" height="140" rx="26" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="650" y="610" width="140" height="70" rx="22" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>

  <!-- Circulation / ambience -->
  <rect x="300" y="480" width="680" height="320" rx="34" fill="#0B1220" stroke="#2B3B66" stroke-width="3" opacity="0.85"/>

  <!-- Zone overlays -->
  <!-- Zone 1: miroir/vasque -->
  <rect x="240" y="220" width="400" height="170" rx="30" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="3"/>
  <text x="280" y="330" class="zoneText">Zone 1: miroir / vasque</text>

  <!-- Zone 2: douche / baignoire -->
  <rect x="760" y="210" width="360" height="300" rx="34" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="4"/>
  <text x="800" y="350" class="zoneText" fill="#BAE6FD">Zone 2: douche/baignoire (humide)</text>

  <!-- Zone 3: toilettes -->
  <rect x="590" y="560" width="270" height="190" rx="34" fill="#A78BFA" fill-opacity="0.09" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="3"/>
  <text x="610" y="690" class="zoneText" fill="#E9D5FF">Zone 3: toilettes</text>

  <!-- Zone 4: circulation/ambiance -->
  <rect x="330" y="450" width="620" height="350" rx="40" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.60" stroke-width="3"/>
  <text x="380" y="560" class="zoneText" fill="#A7F3D0">Zone 4: circulation / ambiance</text>

  <!-- Title -->
  <rect x="90" y="70" width="1220" height="56" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="120" y="108" class="label">Salle de bain decoupee en zones</text>

  <!-- Legend -->
  <rect x="220" y="820" width="960" height="50" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="250" y="852" class="label">Miroir = lumiere nette (IRC eleve) " Douche = luminaire IP " Toilettes = confort " Ambiance = Kelvin chaud</text>
</svg>


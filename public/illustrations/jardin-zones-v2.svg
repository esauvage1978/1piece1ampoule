<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="floor" x1="200" y1="170" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      /* Style generic (textes avec attributs explicites pour un rendu stable). */
      .zoneText{font-family:ui-sans-serif,system-ui;font-size:24px;font-weight:900;fill:#FDE68A}
      .label{font-family:ui-sans-serif,system-ui;font-size:22px;font-weight:800;fill:#E5E7EB}
    </style>
  </defs>

  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="280" cy="210" r="180" fill="#FBBF24" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1100" cy="240" r="220" fill="#38BDF8" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="820" cy="720" r="240" fill="#A78BFA" fill-opacity="0.10" filter="url(#glow)"/>

  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Patio furniture (approx) -->
  <!-- Pergola block (left-top) -->
  <rect x="230" y="210" width="470" height="260" rx="34" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="3"/>
  <rect x="260" y="250" width="410" height="70" rx="20" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Salon de jardin block (left-bottom) -->
  <rect x="230" y="500" width="470" height="240" rx="34" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.70" stroke-width="3"/>
  <rect x="300" y="560" width="330" height="140" rx="24" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>
  <!-- Chairs -->
  <rect x="260" y="585" width="60" height="70" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="560" y="585" width="60" height="70" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Circulation / allee block (right) -->
  <rect x="720" y="220" width="420" height="520" rx="40" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.60" stroke-width="3"/>
  <rect x="760" y="280" width="340" height="160" rx="30" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>

  <!-- Repas / barbecue block (bottom-right) -->
  <rect x="760" y="480" width="300" height="220" rx="36" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="4"/>
  <rect x="790" y="520" width="240" height="90" rx="24" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>

  <!-- Zones overlays -->
  <text x="270" y="315" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="24" font-weight="900">Zone 1: pergola (indirect)</text>
  <text x="270" y="615" fill="#E9D5FF" font-family="ui-sans-serif,system-ui" font-size="24" font-weight="900">Zone 2: salon de jardin</text>
  <text x="770" y="370" fill="#A7F3D0" font-family="ui-sans-serif,system-ui" font-size="24" font-weight="900">Zone 3: allee / circulation</text>
  <text x="805" y="600" fill="#FDE68A" font-family="ui-sans-serif,system-ui" font-size="24" font-weight="900">Zone 4: repas / barbecue</text>

  <!-- Title strip -->
  <rect x="90" y="70" width="1220" height="56" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="120" y="108" fill="#E5E7EB" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800">Jardin decoupe en zones pour guider l'eclairage</text>

  <!-- Legend strip -->
  <rect x="220" y="820" width="960" height="50" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="250" y="852" fill="#E5E7EB" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="800">Pergola = ambiance indirecte + IP, salon = confort (dimmable), allee = securite, repas = Kelvin + IRC</text>
</svg>


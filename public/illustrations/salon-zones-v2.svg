<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="floor" x1="200" y1="170" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1730"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .zoneText{font-family:ui-sans-serif,system-ui;font-size:24px;font-weight:900;fill:#FDE68A}
      .label{font-family:ui-sans-serif,system-ui;font-size:22px;font-weight:800;fill:#E5E7EB}
    </style>
  </defs>

  <rect width="1400" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="280" cy="180" r="170" fill="#FBBF24" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="210" r="210" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="820" cy="700" r="240" fill="#A78BFA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Room -->
  <rect x="180" y="140" width="1040" height="700" rx="40" fill="url(#floor)" stroke="#2B3B66" stroke-width="4"/>

  <!-- TV wall / console (right) -->
  <rect x="860" y="220" width="320" height="110" rx="20" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="900" y="245" width="240" height="65" rx="14" fill="#0B1220" stroke="#2B3B66" stroke-width="2"/>

  <!-- Sofa (center-left) -->
  <rect x="300" y="420" width="520" height="210" rx="30" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="340" y="450" width="440" height="60" rx="20" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>

  <!-- Reading chair (left-bottom) -->
  <rect x="240" y="640" width="160" height="120" rx="26" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="275" y="690" width="95" height="25" rx="12" fill="#141F3E" stroke="#2B3B66" stroke-width="2"/>

  <!-- Side table -->
  <rect x="420" y="650" width="110" height="70" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Coffee area / decor -->
  <rect x="560" y="650" width="260" height="120" rx="28" fill="#111B33" stroke="#2B3B66" stroke-width="3" opacity="0.9"/>

  <!-- Zone overlays -->
  <!-- Zone 1 TV / anti-glare + bias light -->
  <rect x="760" y="190" width="480" height="320" rx="30" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="3"/>
  <text x="790" y="320" class="zoneText">Zone 1: TV</text>

  <!-- Zone 2 Lecture -->
  <rect x="170" y="600" width="360" height="250" rx="30" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="4"/>
  <text x="200" y="720" class="zoneText" fill="#BAE6FD">Zone 2: lecture</text>

  <!-- Zone 3 Ambiance (dimmer + indirect) -->
  <path d="M330 520c140-95 330-95 470 0v190H330V520Z" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="3"/>
  <text x="460" y="655" class="zoneText" fill="#E9D5FF">Zone 3: ambiance</text>

  <!-- Zone 4 Circulation -->
  <rect x="620" y="160" width="240" height="210" rx="26" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.65" stroke-width="3"/>
  <text x="650" y="280" class="zoneText" fill="#A7F3D0">Zone 4: circulation</text>

  <!-- Title strip -->
  <rect x="90" y="70" width="1220" height="56" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="120" y="108" class="label">Salon decoupe en zones: TV, lecture, ambiance</text>
</svg>


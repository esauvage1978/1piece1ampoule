<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#090F1A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="675" rx="48" fill="url(#bg)"/>
  <circle cx="240" cy="140" r="160" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="980" cy="120" r="190" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="640" cy="600" r="210" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Plan simplifie de cuisine -->
  <rect x="120" y="160" width="960" height="420" rx="28" fill="#0F1730" stroke="#2B3B66" stroke-width="4"/>

  <!-- Meubles hauts -->
  <rect x="170" y="210" width="360" height="80" rx="16" fill="#111B33" stroke="#2B3B66"/>
  <rect x="560" y="210" width="260" height="80" rx="16" fill="#111B33" stroke="#2B3B66"/>

  <!-- Plan de travail -->
  <rect x="170" y="310" width="650" height="70" rx="16" fill="#141F3E" stroke="#2B3B66"/>

  <!-- Ilot / table -->
  <rect x="640" y="420" width="310" height="120" rx="20" fill="#111B33" stroke="#2B3B66"/>

  <!-- Refrigerateur -->
  <rect x="860" y="210" width="170" height="170" rx="20" fill="#111B33" stroke="#2B3B66"/>
  <path d="M870 290h150" stroke="#2B3B66" stroke-width="6" stroke-linecap="round"/>

  <!-- Zones -->
  <rect x="170" y="310" width="650" height="70" rx="16" fill="#FBBF24" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="3"/>
  <text x="190" y="352" font-family="ui-sans-serif,system-ui" font-size="22" fill="#FDE68A">Zone 1 : Plan de travail (eclairage de travail)</text>

  <circle cx="600" cy="250" r="38" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="3"/>
  <text x="660" y="258" font-family="ui-sans-serif,system-ui" font-size="22" fill="#BAE6FD">Zone 2 : Eclairage central</text>

  <rect x="640" y="420" width="310" height="120" rx="20" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.75" stroke-width="3"/>
  <text x="660" y="458" font-family="ui-sans-serif,system-ui" font-size="22" fill="#E9D5FF">Zone 3 : Ambiance / coin repas</text>

  <rect x="860" y="210" width="170" height="170" rx="20" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.75" stroke-width="3"/>
  <text x="170" y="528" font-family="ui-sans-serif,system-ui" font-size="22" fill="#A7F3D0">Zone 4 : Electromenager (ampoules specifiques)</text>

  <!-- Legende -->
  <rect x="120" y="92" width="540" height="52" rx="16" fill="#0B1220" stroke="#2B3B66"/>
  <text x="148" y="126" font-family="ui-sans-serif,system-ui" font-size="22" fill="#E5E7EB">
    Schema : decouper la cuisine en zones = meilleures solutions + meilleur confort
  </text>
</svg>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="counter" x1="300" y1="380" x2="1120" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141F3E"/>
      <stop offset="1" stop-color="#101A35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" rx="56" fill="url(#bg)"/>
  <circle cx="280" cy="150" r="160" fill="#FBBF24" fill-opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="1110" cy="190" r="200" fill="#38BDF8" fill-opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="820" cy="690" r="240" fill="#A78BFA" fill-opacity="0.12" filter="url(#softGlow)"/>

  <!-- Kitchen silhouette (plan de travail + meubles) -->
  <!-- Back wall / cabinets base -->
  <rect x="140" y="170" width="1120" height="480" rx="28" fill="#0F1730" stroke="#2B3B66" stroke-width="4"/>

  <!-- Meubles hauts -->
  <rect x="190" y="210" width="420" height="90" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="630" y="210" width="300" height="90" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="950" y="210" width="290" height="90" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>

  <!-- Hotte -->
  <path d="M780 230c-40 0-70 22-70 52v18h140v-18c0-30-30-52-70-52Z" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <rect x="740" y="300" width="80" height="12" rx="6" fill="#2B3B66"/>

  <!-- Plan de travail (main counter) -->
  <rect x="190" y="330" width="1040" height="170" rx="22" fill="url(#counter)" stroke="#2B3B66" stroke-width="4"/>

  <!-- Electromenager (frigo + four/micro + plaques) -->
  <rect x="1140" y="240" width="140" height="360" rx="18" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="1160" y="270" width="100" height="110" rx="12" fill="#0B1220" stroke="#2B3B66" stroke-width="2"/>
  <circle cx="1210" cy="430" r="38" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <path d="M1162 510h96" stroke="#2B3B66" stroke-width="6" stroke-linecap="round"/>

  <!-- Four / zone cuisson -->
  <rect x="640" y="385" width="220" height="120" rx="16" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="670" y="420" width="160" height="50" rx="12" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>
  <circle cx="740" cy="455" r="16" fill="#2B3B66"/>

  <!-- Evier -->
  <rect x="240" y="405" width="170" height="80" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <path d="M270 455c30-18 60-18 90 0" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round"/>

  <!-- Plaques -->
  <rect x="430" y="405" width="170" height="80" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <circle cx="465" cy="445" r="14" fill="#2B3B66"/>
  <circle cx="500" cy="445" r="14" fill="#2B3B66"/>
  <circle cx="535" cy="445" r="14" fill="#2B3B66"/>

  <!-- Ilot -->
  <rect x="520" y="540" width="360" height="170" rx="24" fill="#0B1220" stroke="#2B3B66" stroke-width="4"/>
  <rect x="552" y="585" width="296" height="80" rx="18" fill="#141F3E" stroke="#2B3B66" stroke-width="3"/>

  <!-- Coin repas (table) -->
  <rect x="260" y="560" width="220" height="120" rx="20" fill="#111B33" stroke="#2B3B66" stroke-width="3"/>
  <rect x="275" y="585" width="190" height="70" rx="16" fill="#0F1730" stroke="#2B3B66" stroke-width="2"/>

  <!-- Zones overlays -->
  <!-- Zone 1: plan de travail -->
  <rect x="220" y="350" width="980" height="130" rx="18" fill="#FBBF24" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.85" stroke-width="3"/>
  <!-- Under-cabinet light bars (zone 1) -->
  <g opacity="0.95">
    <rect x="235" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="305" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="375" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="445" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="515" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="585" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="655" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="725" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="795" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="865" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
    <rect x="935" y="322" width="60" height="10" rx="5" fill="#FDE68A"/>
  </g>

  <text x="245" y="450" font-family="ui-sans-serif,system-ui" font-size="26" fill="#FDE68A" font-weight="700">
    Zone 1: plan de travail (eclairage cible)
  </text>

  <!-- Zone 2: eclairage central -->
  <rect x="190" y="190" width="1040" height="420" rx="20" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="3"/>
  <g>
    <circle cx="320" cy="240" r="18" fill="#BAE6FD" fill-opacity="0.45"/>
    <circle cx="700" cy="230" r="20" fill="#BAE6FD" fill-opacity="0.45"/>
    <circle cx="1020" cy="255" r="18" fill="#BAE6FD" fill-opacity="0.45"/>
  </g>
  <text x="720" y="270" font-family="ui-sans-serif,system-ui" font-size="26" fill="#BAE6FD" font-weight="700">
    Zone 2: eclairage central (homogene)
  </text>

  <!-- Zone 3: ambiance -->
  <path d="M170 680c160-120 340-140 520-90c190 52 330 40 520-60v210H170V680Z"
        fill="#A78BFA" fill-opacity="0.11" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="3"/>
  <!-- Pendant lights -->
  <circle cx="640" cy="520" r="16" fill="#E9D5FF" fill-opacity="0.35"/>
  <circle cx="800" cy="520" r="16" fill="#E9D5FF" fill-opacity="0.35"/>
  <text x="320" y="675" font-family="ui-sans-serif,system-ui" font-size="26" fill="#E9D5FF" font-weight="700">
    Zone 3: ambiance (doux + chaud)
  </text>

  <!-- Zone 4: electromenager -->
  <rect x="1098" y="190" width="220" height="460" rx="26" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.65" stroke-width="3"/>
  <text x="1030" y="520" font-family="ui-sans-serif,system-ui" font-size="26" fill="#A7F3D0" font-weight="700">
    Zone 4: electromenager (ampoules specifique)
  </text>

  <!-- Title strip -->
  <rect x="90" y="70" width="1220" height="56" rx="18" fill="#0B1220" stroke="#2B3B66" stroke-width="3"/>
  <text x="120" y="108" font-family="ui-sans-serif,system-ui" font-size="26" fill="#E5E7EB" font-weight="800">
    Cuisine decoupee en zones: meilleures solutions d'eclairage
  </text>
</svg>

